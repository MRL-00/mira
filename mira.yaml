llm:
  model: deepseek/deepseek-v4.1-flash:exacto
  indexing_model: deepseek/deepseek-v4.1-flash
  max_tokens: 8192

filter:
  exclude_patterns:
    - "*.lock"
    - "*.lockb"
    - "package-lock.json"
    - "yarn.lock"
    - "pnpm-lock.yaml"
    - "Pipfile.lock"
    - "poetry.lock"
    - "go.sum"
    - "*.min.js"
    - "*.min.css"
    - "*.map"
    - "*.svg"
    - "*.png"
    - "*.jpg"
    - "*.jpeg"
    - "*.gif"
    - "*.ico"
    - "*.woff"
    - "*.woff2"
    - "*.ttf"
    - "*.eot"
    - "*.pdf"
    - "*.zip"
    - "*.tar.gz"
    - "*generated/*"
    - "*Generated/*"
    - "*generated-sources/*"
    - "*dist/*"
    - "*build/*"
    - "*coverage/*"
    - "*vendor/*"
    - "*node_modules/*"
    - "*.generated.*"
    - "*.g.dart"
    - "*.freezed.dart"
    - "*.gr.dart"
    - "*.designer.cs"
    - "*.Designer.cs"
    - "*.g.cs"
    - "*.pb.go"
    - "*_grpc.pb.go"
    - "*.pb.dart"
    - "*.gen.ts"

review:
  review_on_synchronize: false
  agentic_tools: true
